services:
  app:
    image: ${APP_IMAGE:-ghcr.io/iyouknow/10db:v0.1.0}
    container_name: 10db-launch
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: ":8080"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      APP_SESSION_TTL_HOURS: ${APP_SESSION_TTL_HOURS:-24}
      CONTROL_DB_PATH: /data/10db-launch.sqlite
      PG_ADMIN_HOST: ${PG_ADMIN_HOST}
      PG_ADMIN_PORT: ${PG_ADMIN_PORT:-5432}
      PG_ADMIN_DB: ${PG_ADMIN_DB:-postgres}
      PG_ADMIN_USER: ${PG_ADMIN_USER:-postgres}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD}
      PG_SSL_MODE: ${PG_SSL_MODE:-disable}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "/app/10db-launch", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  app_data:
